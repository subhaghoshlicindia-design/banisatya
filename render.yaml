# Free web service. Persistent PostgreSQL is provided separately by Neon Free.
services:
  - type: web
    name: banisatya-free
    runtime: node
    region: singapore
    plan: free
    numInstances: 1
    buildCommand: npm ci && npm test
    startCommand: node server.cjs
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: SETUP_TOKEN
        generateValue: true
      # Render supplies RENDER_EXTERNAL_URL. Set PORTAL_ORIGIN separately only
      # when using a custom domain instead of the default onrender.com address.
