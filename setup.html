<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Banisatya Wealth Pvt Ltd initial setup</title><link rel="stylesheet" href="styles.css"><link rel="icon" href="banisatya-logo.svg" type="image/svg+xml"></head><body>
